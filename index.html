<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Mockup completo do Brota: 76 telas em duas UIs nativas, Material 3 Expressive (Android) e Liquid Glass (iOS), lado a lado.">
<meta name="color-scheme" content="light dark">
<title>Brota &middot; Mockup completo do app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg-light:#FFF8F2; --bg-dark:#1A1315;
  --text-light:#3D2C2E; --text-dark:#F0E6E2;
  --brand-real:#F4A7B9; --brand-real-deep:#E8889E;
  --brand-ai:#A8D5A2; --brand-warning:#FFD07A;
  --shell-bg:rgba(61,44,46,0.06); --shell-border:rgba(61,44,46,0.10);
  --shell-glass:rgba(255,248,242,0.88);
  /* altura da moldura (cabecalho + abas); o JS mede e corrige */
  --chrome:210px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg-light);color:var(--text-light);
  transition:background .6s ease,color .6s ease;min-height:100%;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;overflow-x:clip;}
body.dark{background:var(--bg-dark);color:var(--text-dark);--shell-bg:rgba(240,230,226,0.07);--shell-border:rgba(240,230,226,0.12);--shell-glass:rgba(26,19,21,0.88);}

/* ── cabecalho ──────────────────────────────────────────────────────── */
.hero{padding:26px 44px 18px;display:flex;justify-content:space-between;gap:28px;align-items:flex-start;flex-wrap:wrap;}
.hero-brand .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;opacity:.5;margin-bottom:6px;}
.hero-brand .title{font-size:clamp(25px,3.6vw,42px);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin-bottom:8px;}
.hero-brand .title em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--brand-real-deep);}
.hero-brand .sub{font-size:13px;line-height:1.55;opacity:.72;max-width:580px;}
.hero-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--shell-border);background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:600;cursor:pointer;opacity:.9;transition:all .25s ease;text-decoration:none;min-height:40px;}
.btn-pill:hover{opacity:1;transform:scale(1.03);border-color:var(--brand-real);}
.btn-pill .dot{width:12px;height:12px;border-radius:50%;background:var(--brand-real);transition:transform .4s;}
body.dark .btn-pill .dot{transform:rotate(180deg);background:var(--brand-warning);}

/* ── barra de abas (telas grandes) ──────────────────────────────────── */
.tab-bar{position:sticky;top:0;z-index:50;padding:12px 44px;background:var(--shell-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--shell-border);}
.tab-bar-inner{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:thin;}
.tab{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;border:1px solid transparent;background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:600;cursor:pointer;opacity:.62;transition:all .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.tab:hover{opacity:1;background:var(--shell-bg);}
.tab .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--shell-bg);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}
.tab.active{background:var(--brand-real);color:#fff;opacity:1;box-shadow:0 4px 14px -4px rgba(232,136,158,.5);transform:translateY(-1px);}
.tab.active .num{background:rgba(255,255,255,.25);color:#fff;}
.tab-flow-label{flex-shrink:0;display:inline-flex;align-items:center;padding:0 10px 0 6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.45;white-space:nowrap;border-left:1px solid var(--shell-border);margin-left:4px;}
.tab-flow-label:first-child{border-left:none;margin-left:0;}

/* ── palco ──────────────────────────────────────────────────────────── */
.stage{position:relative;flex:1;display:flex;flex-direction:column;}
.frame-wrap{position:relative;flex:1;background:var(--shell-bg);border-top:1px solid var(--shell-border);}
.frame-wrap iframe{width:100%;height:100%;min-height:calc(100dvh - var(--chrome));border:none;display:block;background:var(--bg-light);transition:opacity .3s ease;}
body.dark .frame-wrap iframe{background:var(--bg-dark);}

/* ── setas flutuantes (telas grandes) ───────────────────────────────── */
.floating-nav{position:fixed;top:50%;z-index:40;transform:translateY(-50%);}
.floating-nav.prev{left:16px;} .floating-nav.next{right:16px;}
.floating-nav button{width:52px;height:52px;border-radius:50%;border:1px solid var(--shell-border);background:var(--shell-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 22px -6px rgba(61,44,46,.18);}
.floating-nav button:hover{transform:scale(1.08);border-color:var(--brand-real);}
.floating-nav button:disabled{opacity:.3;cursor:not-allowed;transform:scale(.95);}
.floating-nav button svg{width:22px;height:22px;}

/* ── barra de baixo: contador nas grandes, controle inteiro no celular ─ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;align-items:center;gap:8px;
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));pointer-events:none;}
.dock>*{pointer-events:auto;}
.counter{padding:7px 16px;border-radius:999px;background:var(--shell-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--shell-border);font-size:12px;font-weight:700;box-shadow:0 8px 22px -6px rgba(61,44,46,.18);white-space:nowrap;}
.counter b{color:var(--brand-real-deep);}
.dock-btn{display:none;width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid var(--shell-border);background:var(--shell-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);color:inherit;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 8px 22px -6px rgba(61,44,46,.18);}
.dock-btn svg{width:20px;height:20px;}
.dock-btn:disabled{opacity:.35;}
.picker{display:none;flex:1;min-width:0;max-width:340px;height:46px;border-radius:999px;border:1px solid var(--shell-border);background:var(--shell-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  color:inherit;font:inherit;font-size:13px;font-weight:700;padding:0 16px;box-shadow:0 8px 22px -6px rgba(61,44,46,.18);
  -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;}
.plat{display:none;flex:0 0 auto;height:46px;padding:0 13px;border-radius:999px;border:1px solid var(--shell-border);
  background:var(--shell-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  color:inherit;font:800 11px/1 'Nunito',system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;
  align-items:center;justify-content:center;box-shadow:0 8px 22px -6px rgba(61,44,46,.18);white-space:nowrap;}
.plat b{color:var(--brand-real-deep);}
.picker{text-overflow:ellipsis;}
.picker optgroup,.picker option{background:var(--bg-light);color:var(--text-light);font-weight:600;}
body.dark .picker optgroup,body.dark .picker option{background:var(--bg-dark);color:var(--text-dark);}

/* ── celular ────────────────────────────────────────────────────────── */
@media(max-width:860px){
  /* no celular a moldura de revisao some: sobra o app e a barra de escolher.
     O cabecalho, as abas e o texto de apresentacao so atrapalham quem quer
     ver como o app e. */
  .hero{display:none;}
  .tab-bar{display:none;}
  .frame-wrap{border-top:none;padding-bottom:calc(58px + env(safe-area-inset-bottom));}
  .frame-wrap iframe{min-height:0;height:100%;}
  .stage{flex:1;min-height:100dvh;}
  body{height:100dvh;overflow:hidden;}
  .floating-nav{display:none;}
  .dock{gap:7px;padding-left:10px;padding-right:10px;}
  .dock-btn{display:flex;}
  .plat{display:flex;}
  .picker{display:block;}
  .counter{display:none;}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>

<div class="floating-nav next"><button id="next-btn" onclick="navTo(currentIdx+1)" aria-label="Pr&oacute;xima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div>

  <div class="counter"><span id="counter-cur">1</span> / <span id="counter-total">76</span> &middot; <b id="counter-flow">Onboarding</b></div>
</div>

let currentIdx=0;

/* entidade HTML no rotulo serve pra innerHTML, nao pra <option> nem pra title */
const semEntidade = (s) => { const d=document.createElement('textarea'); d.innerHTML=s; return d.value; };

function initFromHash(){
  const h=location.hash.replace('#','');
  const i=SCREENS.findIndex(s=>s.num===h);
  if(i>=0)currentIdx=i;
}

function renderTabs(){
  let html='',last=null;
  SCREENS.forEach((s,i)=>{
    if(s.flow&&s.flow!==last){html+=`<span class="tab-flow-label">${s.flow}</span>`;last=s.flow;}
    html+=`<button class="tab" data-idx="${i}" onclick="navTo(${i})" role="tab"><span class="num">${s.num}</span><span>${s.name}</span></button>`;
  });
  document.getElementById('tab-bar').innerHTML=html;
}

/* no celular a tira de 76 abas nao se navega; um <select> nativo se navega */
function renderPicker(){
  const sel=document.getElementById('picker');
  let html='',grupo=null;
  SCREENS.forEach((s,i)=>{
    const fluxo=semEntidade(s.flow);
    if(fluxo!==grupo){ if(grupo!==null)html+='</optgroup>'; html+=`<optgroup label="${fluxo}">`; grupo=fluxo; }
    html+=`<option value="${i}">${s.num}. ${semEntidade(s.name)}</option>`;
  });
  sel.innerHTML=html+'</optgroup>';
}

/* a altura da moldura muda com a quebra de linha do cabecalho; medir e mais
   confiavel que chutar um valor fixo por media query */
function mediChrome(){
  const hero=document.querySelector('.hero').offsetHeight;
  const abas=document.querySelector('.tab-bar');
  const alturaAbas=getComputedStyle(abas).display==='none'?0:abas.offsetHeight;
  document.documentElement.style.setProperty('--chrome',(hero+alturaAbas)+'px');
}

function navTo(idx){
  if(idx<0||idx>=SCREENS.length)return;
  currentIdx=idx;
  const s=SCREENS[idx];
  const fr=document.getElementById('screen-frame');
  fr.style.opacity='0';
  fr.src=s.file;
  fr.onload=()=>{
    fr.style.opacity='1';
    /* o shim ja le o localStorage sozinho; isto cobre o caso de ele ter
       cacheado a escolha antiga antes de a troca acontecer */
    if(fr.contentWindow&&fr.contentWindow.brotaPlataforma)fr.contentWindow.brotaPlataforma(platAtual());
  };
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  ['prev-btn','dock-prev'].forEach(id=>document.getElementById(id).disabled=idx===0);
  ['next-btn','dock-next'].forEach(id=>document.getElementById(id).disabled=idx===SCREENS.length-1);
  document.getElementById('counter-cur').textContent=idx+1;
  document.getElementById('counter-flow').innerHTML=s.flow;
  document.getElementById('picker').value=String(idx);
  const link=document.getElementById('abrir-sozinha');
  link.href=s.file;
  link.title='Abrir '+semEntidade(s.name)+' em outra aba';
  history.replaceState(null,'','#'+s.num);
  const at=document.querySelector('.tab.active');
  if(at)at.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowLeft'){e.preventDefault();navTo(currentIdx-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();navTo(currentIdx+1);}
  else if(e.key==='Home'){e.preventDefault();navTo(0);}
  else if(e.key==='End'){e.preventDefault();navTo(SCREENS.length-1);}
});
addEventListener('hashchange',()=>{
  const h=location.hash.replace('#','');
  const i=SCREENS.findIndex(s=>s.num===h);
  if(i>=0&&i!==currentIdx)navTo(i);
});
addEventListener('resize',mediChrome);

/* A escolha de plataforma vale para todas as telas, nao so para a de agora:
   fica no localStorage, e cada tela le na abertura. O quadro de dentro e da
   mesma origem, entao da pra falar com ele direto. */
const CHAVE_PLAT='brota-plataforma';
function platAtual(){
  try{const v=localStorage.getItem(CHAVE_PLAT);if(v==='1'||v==='2')return +v;}catch(e){}
  return /iPad|iPhone|iPod/.test(navigator.userAgent)?2:1;
}
function pintarPlat(){
  const n=platAtual();
  document.getElementById('plat-txt').innerHTML = n===2?'iOS':'Android';
  document.getElementById('plat').title = n===2?'Vendo o iOS. Tocar troca para Android.'
                                               :'Vendo o Android. Tocar troca para iOS.';
}
function trocarPlataforma(){
  const n=platAtual()===2?1:2;
  try{localStorage.setItem(CHAVE_PLAT,String(n));}catch(e){}
  pintarPlat();
  const w=document.getElementById('screen-frame').contentWindow;
  if(w&&w.brotaPlataforma)w.brotaPlataforma(n);
}
pintarPlat();

document.getElementById('hero-total').textContent=SCREENS.length;
document.getElementById('counter-total').textContent=SCREENS.length;
initFromHash();renderTabs();renderPicker();navTo(currentIdx);mediChrome();
addEventListener('load',mediChrome);
</script>
</body>
</html>
