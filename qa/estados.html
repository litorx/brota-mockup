<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>QA · estados lado a lado</title>
<!--
  Ferramenta de QA, nao faz parte do mockup e nao aparece no index.

  Mostra TODOS os estados de estudio de uma tela de uma vez, um telefone por
  estado, pra conferir no olho o que script nenhum pega: contraste, layout que
  estoura, texto que some num fundo, sentido da copy.

  Precisa estar no mesmo dominio das telas: o harness clica o botao de estado
  dentro do iframe, e isso e bloqueado entre origens diferentes.

  Uso:  qa/estados.html?t=03-app/a1-home.html
-->
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#E9E2DC; font:13px/1.4 system-ui, sans-serif; color:#3D2C2E; }
  h1 { font-size:15px; margin:0; padding:10px 14px; background:#fff; position:sticky; top:0; z-index:5;
       box-shadow:0 1px 0 rgba(0,0,0,0.08); }
  h1 small { font-weight:400; opacity:0.6; }
  .grade { display:flex; flex-wrap:wrap; gap:6px; padding:8px; }
  .cel { width:300px; }
  .rot { font-size:11px; font-weight:700; padding:3px 6px; background:#fff; border-radius:5px 5px 0 0;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .janela { width:300px; height:620px; overflow:hidden; background:#F6F1EC; border-radius:0 0 5px 5px; }
  iframe { width:1500px; height:1400px; border:0; transform:scale(0.42); transform-origin:0 0; }
</style>
</head>
<body>
<h1 id="t">carregando…</h1>
<div class="grade" id="g"></div>
<script>
var tela = new URLSearchParams(location.search).get('t') || '03-app/a1-home.html';
var alvo = '../' + tela;
document.getElementById('t').textContent = tela;

/* Esconde tudo que nao e telefone: cabecalho do estudio, notas de handoff e os
   proprios botoes de estado. O que sobra e o que a usuaria veria. */
var LIMPAR = 'header,.brand,.brand-eyebrow,.brand-title,.brand-sub,.controls,' +
             '.annotations,.note,.studio,.state-toggle,.theme-toggle,.platform-label,.desc';

function cela(i, rotulo) {
  var d = document.createElement('div');
  d.className = 'cel';
  d.innerHTML = '<div class="rot">' + (i === -1 ? 'INICIAL' : (i + 1) + '. ' + rotulo) + '</div>' +
                '<div class="janela"></div>';
  var f = document.createElement('iframe');
  f.src = alvo;
  f.onload = function () {
    var doc = f.contentDocument;
    setTimeout(function () {
      if (i >= 0) {
        var b = doc.querySelectorAll('.state-btn')[i];
        if (b) b.click();
      }
      setTimeout(function () {
        doc.querySelectorAll(LIMPAR).forEach(function (e) { e.style.display = 'none'; });
        doc.body.style.background = '#F6F1EC';
      }, 300);
    }, 700);
  };
  d.querySelector('.janela').appendChild(f);
  return d;
}

/* Le a lista de estados numa carga de sondagem, depois monta uma celula por estado. */
var sonda = document.createElement('iframe');
sonda.style.cssText = 'width:1500px;height:900px;position:absolute;left:-4000px';
sonda.src = alvo;
sonda.onload = function () {
  setTimeout(function () {
    var btns = sonda.contentDocument.querySelectorAll('.state-btn');
    var g = document.getElementById('g');
    g.appendChild(cela(-1, ''));
    for (var i = 0; i < btns.length; i++) {
      g.appendChild(cela(i, btns[i].textContent.replace(/\s+/g, ' ').trim().slice(0, 30)));
    }
    document.getElementById('t').innerHTML = tela +
      ' <small>· ' + btns.length + ' estados + inicial</small>';
    sonda.remove();
  }, 900);
};
document.body.appendChild(sonda);
</script>
</body>
</html>
